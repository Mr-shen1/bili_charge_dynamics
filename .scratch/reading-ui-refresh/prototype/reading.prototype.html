function treeFor(id){
 const items=data(), map=new Map(items.map(r=>[r.id,r]));let start=map.get(id);const visited=new Set();
 while(start&&start.parent&&map.has(start.parent)&&!visited.has(start.id)){visited.add(start.id);start=map.get(start.parent);}
 if(!start)return {items:[],start:null,missing:false};
 const ids=new Set([start.id]);let changed=true;
 while(changed){changed=false;for(const r of items){if(ids.has(r.parent)&&!ids.has(r.id)){ids.add(r.id);changed=true;}}}

}

 $('app').querySelectorAll('[data-conversation]').forEach(el=>el.onclick=()=>go({page:'conversation',from:'thread',selected:el.dataset.conversation}));
 $('app').querySelectorAll('[data-manage-up]').forEach(el=>el.onclick=()=>{management.selected=Number(el.dataset.manageUp);const up=managedUps[management.selected];management.draftMode=up.mode;management.draftCount=up.count;management.feedback='';go({page:'manageUp',from:'manage'});});
 if($('monitor-toggle'))$('monitor-toggle').onclick=()=>{const up=managedUps[management.selected];if(up.deleted){up.deleted=false;up.enabled=true;}else{up.enabled=!up.enabled;}management.feedback=`原型演示：已${up.enabled?'启用':'停止'}监控，使用已保存配置，未提交下方未保存的更改。`;update({scroll:screen.scrollTop});};
 $('app').querySelectorAll('[name="monitor-mode"]').forEach(el=>el.onchange=()=>{management.draftMode=el.value;management.feedback='';update({scroll:screen.scrollTop});});
 if($('recent-count'))$('recent-count').oninput=e=>{management.draftCount=e.target.value;};
 if($('save-config'))$('save-config').onclick=()=>{if($('recent-count')&&!$('recent-count').reportValidity())return;const up=managedUps[management.selected];up.mode=management.draftMode;up.count=Number(management.draftCount);management.feedback='原型演示：配置已保存；监控启停状态保持不变。';update({scroll:screen.scrollTop});};
 if($('delete-monitor'))$('delete-monitor').onclick=()=>{if(!window.confirm('仅在原型中模拟删除监控配置，保留身份与动态。确认吗？'))return;const up=managedUps[management.selected];up.deleted=true;up.enabled=false;management.feedback='原型演示：已删除配置；可使用右侧按钮重新添加。';update({scroll:0});};
 if($('notification-select'))$('notification-select').onchange=e=>{management.notification=e.target.value;management.listFeedback='原型演示：通知选项已更改，不发送任何消息。';update({scroll:screen.scrollTop});};
 if($('add-up-form'))$('add-up-form').onsubmit=e=>{e.preventDefault();const uid=$('new-uid').value.trim();if(!/^\d+$/.test(uid))return;if(managedUps.some(up=>up.uid===uid&&!up.deleted)){management.listFeedback='该 UID 已在原型列表中。';}else{managedUps.push({uid,name:`示例 UP ${uid}`,enabled:false,mode:'recent',count:5,deleted:false});management.listFeedback='原型演示：已添加示例 UP，未查询真实身份。';}update({scroll:screen.scrollTop});};
}
function applyDevice(next){device=next;$('viewport').className=`viewport ${device==='desktop'?'':device}`;document.querySelectorAll('[data-device]').forEach(el=>el.classList.toggle('active',el.dataset.device===device));const conversationOption=$('page-select').querySelector('[value="conversation"]');conversationOption.disabled=device==='desktop';$('page-select').querySelector('[value="thread"]').disabled=device==='desktop';if(device==='desktop'&&['thread','conversation'].includes(state.page))update({page:'detail',from:null,scroll:0});}
document.querySelectorAll('[data-device]').forEach(el=>el.onclick=()=>applyDevice(el.dataset.device));
$('page-select').onchange=e=>{const page=e.target.value;go({page,from:null,selected:state.sample==='pair'?'pair-b':state.sample==='missing'?'m2':'b',replyPage:1});};
$('case-select').onchange=e=>{const sample=e.target.value;go({sample,page:device==='desktop'?'detail':'thread',from:null,replyPage:1,expanded:device==='desktop',selected:sample==='pair'?'pair-b':sample==='missing'?'m2':'b'});};
$('type-select').onchange=e=>{typography=e.target.value;update({scroll:screen.scrollTop});};
const initialPage=location.hash.slice(1);if(['list','detail','thread','conversation','manage','manageUp'].includes(initialPage))state.page=initialPage;
const initialParams=new URLSearchParams(location.search);
state.dynamic=initialParams.get('dynamic')==='1'?1:0;
const initialScope=Number(initialParams.get('scope'));if(Number.isInteger(initialScope)&&initialScope>=0&&initialScope<ups.length)state.scope=initialScope;
typography=initialParams.get('typography')==='previous'?'previous':'optimized';
if(initialParams.get('device')==='desktop')applyDevice('desktop');
history.replaceState({...state},'',`#${state.page}`);render();
</script>
</body>
</html>
