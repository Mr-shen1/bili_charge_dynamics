# 阿里云 ECS · 阶段一：SSH 隧道访问（无公网 Web 入口）
#
# 安装到 /etc/nginx/conf.d/bili.conf；安装前先装片段：
#     sudo install -D -m 0644 deploy/nginx-locations.conf \
#         /etc/nginx/snippets/bili-locations.conf
#
# 设计前提：安全组只放行 22，80/443 全部关闭。Nginx 只监听回环地址，
# 公网无法直接访问；维护者通过 SSH 本地端口转发建立访问通道：
#
#     ssh -N -L 4173:127.0.0.1:4173 <user>@<公网IP>
#
# 该形态下管理页与写 API 没有公网暴露面，因此不引入应用层鉴权。
# 唯一的安全边界是 SSH：必须禁用密码登录与 root 登录，见
# docs/deployment/README.md「SSH 硬化」。

server {
    # 仅回环监听。不要改成 0.0.0.0：本阶段没有任何公网 Web 入口。
    listen 127.0.0.1:4173;
    server_name _;

    # 无凭据输入也不能假设 URL 不含敏感参数；不记录原始请求或上游错误 URI。
    # 启动/配置诊断仍由 nginx -t 和进程退出状态提供，运行故障检查 HTTP 状态。
    access_log off;
    error_log /dev/null;

    # ECS 公网带宽按固定带宽计（本项目目标机为 3 Mbps），必须压缩文本资源。
    # text/html 始终压缩；其余类型需显式列出。nginx 未必内置 .js 的
    # text/javascript 映射，故两类 JS MIME 都保留。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 静态根、缓存、资源命名空间、SPA 回退与 /api 反代规则。
    include /etc/nginx/snippets/bili-locations.conf;
}
