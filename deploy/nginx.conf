# 放入 Nginx 的 http 上下文（例如 conf.d）；主配置必须包含 mime.types。
# 本示例面向域名根路径部署；root 改为当前发布产物的绝对目录或 current 符号链接。
server {
    listen 127.0.0.1:4173;
    server_name _;
    root /srv/dynamics-viewer/current;
    index index.html;
    etag on;

    # 无凭据输入也不能假设 URL 不含敏感参数；不记录原始请求或上游错误 URI。
    # 启动/配置诊断仍由 nginx -t 和进程退出状态提供，运行故障检查 HTTP 状态。
    access_log off;
    error_log /dev/null;

    # 资源错误不变成入口 HTML，不套用成功资源的长期缓存。
    error_page 404 = @missing_resource;
    location @missing_resource {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 保留给 Vite 输出的内容哈希 JS/CSS。不得往此目录放未版本化文件。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 应用自有的异常图片占位（未版本化）；缺失文件不能落入 SPA 回退。
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /default-avatar {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 管理 API 由独立 FastAPI 进程提供；成功/错误均不得回退 SPA HTML。
    location = /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # 包括 /manage、有效详情、带点号的动态 ID 和未知页面：由前端分别表达状态。
    # 不用全局 error_page 404 /index.html，以免资源错误变成 200 HTML。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
