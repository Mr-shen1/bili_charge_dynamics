# 阿里云 ECS · 阶段二：域名 + HTTPS + Basic Auth
#
# 前置条件（缺一不可）：
#   1. 域名已完成 ICP 备案（大陆节点强制，见 docs/deployment/aliyun-ecs.md「备案」）。
#   2. 已签发证书并安装到 ssl_certificate / ssl_certificate_key 指向的路径。
#   3. 已生成密码文件 /etc/nginx/.htpasswd（见 docs/deployment/aliyun-ecs.md「生成密码文件」）。
#
# 安装到 /etc/nginx/conf.d/bili.conf，替换 nginx-ecs-tunnel.conf。
# 片段安装路径必须一致：
#     sudo install -D -m 0644 deploy/nginx-locations.conf \
#         /etc/nginx/snippets/bili-locations.conf
#
# 为什么只锁管理面而不锁全站：
#   公开阅读页（/、/ups/:upId、/dynamics/:dynamicId）只调用 /api/archive/*，
#   属于公开归档内容；/api/manage/* 与 /api/sync/* 才是可读写配置的接口。
#   全站加锁会让阅读功能对外部访问者失效，且必须改前端。
#
# Basic Auth 只在 HTTPS 之上成立：凭据是 Base64 而非加密，明文 HTTP
# 上等于公开密码。不要在 listen 80 的 server 里复用本文件的 auth_basic。

server {
    listen 80;
    server_name example.cn;

    # 只做跳转，不提供任何内容，避免明文访问管理面。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 注意：不要在下面的 location 里再加 add_header，否则会覆盖这里。
    # 片段内的每个 location 都有 add_header Cache-Control，nginx 的
    # add_header 不跨层级继承——所以 HSTS 若需要，必须逐 location 添加，
    # 本项目默认不启用（个人站点收益有限，且易与子域配置冲突）。

    # realm 字符串必须在所有受保护 location 中完全一致。浏览器按
    # 「同源 + realm」缓存凭据；realm 不同会导致重复弹框，且登录过
    # /manage 之后 /api/manage/* 的 fetch 不会自动带上凭据。
    #
    # 登录流程：先直接打开 https://<域名>/manage 触发浏览器原生对话框，
    # 认证成功后凭据被缓存，管理页内 getManageApi 发出的同源请求自动携带
    # Authorization，前端无需改动；未认证时后端返回 401，前端按
    # src/manage/managementApi.ts 映射为固定提示文案。

    # 管理是两级页面：/manage 是 UP 列表，/manage/ups/<uid> 是单 UP 管理页。
    # 两处 must 使用同一 realm，否则单 UP 页会绕过认证直接返回入口 HTML。
    location = /manage {
        auth_basic           "bili manage";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ^~ /manage/ {
        auth_basic           "bili manage";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # ^~ 前缀匹配按最长优先，因此这两个块优先于片段中的 ^~ /api/。
    location ^~ /api/manage/ {
        auth_basic           "bili manage";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # 写操作：初始化、媒体重试、根评论同步。管理页会触发，必须同样保护。
    location ^~ /api/sync/ {
        auth_basic           "bili manage";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # /api/archive/* 保持公开：阅读页依赖它。不要在这里加 auth_basic。
    include /etc/nginx/snippets/bili-locations.conf;
}
