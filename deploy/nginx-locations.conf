# 阿里云 ECS 部署共用片段：静态站点根、缓存/回退/API 反代规则。
#
# 放入 Nginx 的 **server 上下文**（不是 http）：由 nginx-ecs-tunnel.conf 和
# nginx-ecs-https.conf 各自 include。安装位置必须与两份 server 配置里的
# include 绝对路径一致：
#
#     /etc/nginx/snippets/bili-locations.conf
#
# 本片段的规则与 deploy/nginx.conf 同源（后者是 scripts/verify-static-delivery.mjs
# 的隔离验证基准）。三份文件的 location 规则必须保持一致：改动任一处的
# 缓存、回退、资源命名空间或 API 反代规则时，同步改其余两份。
#
# root 指向 current 符号链接；发布时原子切换，不就地覆盖 dist/。

    root /srv/dynamics-viewer/current;
    index index.html;
    etag on;

    # 资源错误不变成入口 HTML，不套用成功资源的长期缓存。
    error_page 404 = @missing_resource;
    location @missing_resource {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 保留给 Vite 输出的内容哈希 JS/CSS。不得往此目录放未版本化文件。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 应用自有的异常图片占位（未版本化）；缺失文件不能落入 SPA 回退。
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /default-avatar {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 管理/归档 API 由独立 FastAPI 进程提供；成功/错误均不得回退 SPA HTML。
    location = /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # 包括 /manage、有效详情、带点号的动态 ID 和未知页面：由前端分别表达状态。
    # 不用全局 error_page 404 /index.html，以免资源错误变成 200 HTML。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
